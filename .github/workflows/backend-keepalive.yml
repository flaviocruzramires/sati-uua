name: Backend Keep-Alive

# Mantém o Render (backend) e o Neon (Postgres) acordados, evitando o cold start.
# O Render (plano free) hiberna após ~15 min de inatividade; o Neon suspende após
# ~5 min sem queries. O /health consulta o banco (SELECT 1), então um ping a cada
# 4 min mantém os dois ativos. Repo é público → GitHub Actions é grátis/ilimitado.
on:
  schedule:
    - cron: "*/4 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /health (consulta o banco)
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            https://sati-uua-server.onrender.com/health \
            --max-time 30 --retry 2 --retry-delay 5
