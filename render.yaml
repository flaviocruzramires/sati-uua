# Blueprint do Render para o servidor SATI-UUA.
# Banco de dados fica no Neon.tech (fora do Render) — informe a connection
# string do Neon na variável DATABASE_URL no painel do serviço.
#
# Deploy: Render > New > Blueprint > aponte para este repositório.
services:
  - type: web
    name: sati-uua-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # JWT_SECRET forte gerado automaticamente pelo Render.
      - key: JWT_SECRET
        generateValue: true
      # Cole aqui (ou no painel) a connection string do Neon, com ?sslmode=require.
      # Ex.: postgresql://user:senha@ep-xxx.us-east-2.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Defina no PRIMEIRO deploy para criar o admin; remova depois se quiser.
      - key: ADMIN_LOGIN
        sync: false
      - key: ADMIN_SENHA
        sync: false

  # ── Front-end Flutter Web (Static Site) ────────────────────────────────────
  # Site estático servido pela CDN do Render (grátis, sem cold start). O Render
  # gera uma URL https://<nome>.onrender.com automaticamente. O build instala o
  # Flutter (canal stable) e gera os arquivos web; o roteamento SPA é resolvido
  # pelo rewrite abaixo (qualquer rota -> index.html).
  - type: web
    name: sati-uua-web
    runtime: static
    autoDeploy: true
    buildCommand: |
      git clone https://github.com/flutter/flutter.git --depth 1 -b 3.32.8 "$HOME/flutter"
      export PATH="$HOME/flutter/bin:$PATH"
      flutter --version
      cd mobile
      flutter pub get
      flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"
    staticPublishPath: mobile/build/web
    envVars:
      # URL da API (backend no Render). Trocar se o nome do serviço mudar.
      - key: API_BASE_URL
        value: https://sati-uua-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
